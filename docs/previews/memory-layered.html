<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>Memory · Link — 层叠入口预览</title>
  <style>
    :root {
      --canvas: #f1f3f5; --page: #fff; --ink: #1c1c1e; --muted: #636366;
      --facts: #e3f1fb; --core: #a8d0ef; --list: #c1e4f3; --mirror: #fff9e6; --gaze: #99c3e4;
      --card-ink: #263d4e; --card-muted: #465d6b; --focus: #2479b5;
      --line: #e7eaee; --surface: #f6f7f9;
    }
    * { box-sizing: border-box; }
    body { margin: 0; color: var(--ink); background: var(--canvas); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif; -webkit-font-smoothing: antialiased; }
    button { font: inherit; border: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; }
    button:focus-visible { outline: 3px solid var(--focus); outline-offset: -5px; }
    button:active { filter: brightness(.97); }
    .phone { width: min(100%, 390px); min-height: 844px; margin: 32px auto; background: var(--page); border-radius: 36px; overflow: clip; box-shadow: 0 16px 64px #182b4212, 0 0 0 1px #152f4310; }
    .header { display: grid; grid-template-columns: 44px 1fr 44px; align-items: center; padding: 19px 14px 12px; min-height: 76px; background: var(--page); }
    .header h1 { font-size: 16px; font-weight: 600; text-align: center; margin: 0; }
    .back { width: 44px; height: 44px; display: grid; place-items: center; border-radius: 50%; background: transparent; color: var(--ink); transition: background 140ms ease; }
    .back svg { width: 21px; height: 21px; }
    .back:disabled { visibility: hidden; }
    .intro { padding: 29px 25px 27px; }
    .intro h2 { margin: 0 0 9px; font-size: 23px; font-weight: 550; letter-spacing: -.6px; }
    .intro p { margin: 0; font-size: 13px; color: var(--muted); }
    .stack { margin: 0 16px; isolation: isolate; }
    .layer { position: relative; display: block; width: 100%; height: 96px; padding: 17px 23px 25px; border-radius: 30px 30px 0 0; text-align: left; color: var(--card-ink); background: var(--color); transition: filter 140ms ease; }
    .layer + .layer { margin-top: -18px; }
    .layer:last-child { height: 78px; padding-bottom: 7px; border-radius: 30px; }
    .layer-title { display: flex; align-items: baseline; gap: 10px; line-height: 28px; }
    .english { font-family: "Baskerville", "Iowan Old Style", "Palatino Linotype", Georgia, serif; font-size: 24px; font-style: italic; font-weight: 400; letter-spacing: -.4px; }
    .number { margin-left: auto; padding-right: 18px; color: var(--card-muted); font-size: 12px; font-variant-numeric: tabular-nums; }
    .desc { display: block; margin-top: 6px; font-size: 12px; color: var(--card-muted); line-height: 18px; }
    .arrow { position: absolute; top: 27px; right: 20px; width: 14px; height: 14px; opacity: .65; }
    .footer { margin: 23px 20px 0; padding-bottom: 30px; text-align: center; color: var(--muted); font-size: 11px; letter-spacing: .25px; }
    [hidden] { display: none !important; }
    .detail { padding: 27px 22px; }
    .detail-title { margin: 0 0 25px; display: flex; align-items: baseline; gap: 10px; }
    .detail-title .english { font-size: 28px; }
    .sample { background: var(--sample-color); border-radius: 26px; padding: 23px; }
    .sample h3 { margin: 0 0 13px; font-size: 16px; font-weight: 550; }
    .sample p { margin: 0; font-size: 14px; line-height: 1.95; }
    .sample small { display: block; margin-top: 19px; color: var(--muted); font-size: 11px; }
    .preview-note { color: var(--muted); text-align: center; font-size: 11px; margin: 22px 0; }
    .try-avatar { padding: 0 24px 30px; text-align: center; }
    .try-avatar button { display: inline-flex; align-items: center; gap: 9px; min-height: 44px; padding: 7px 14px; border-radius: 22px; color: var(--ink); background: var(--surface); transition: filter 140ms ease; }
    .try-avatar img { width: 28px; height: 28px; object-fit: cover; border-radius: 50%; }
    .try-avatar p { margin: 10px 0 0; font-size: 11px; line-height: 1.6; color: var(--muted); }
    @media (hover: hover) { .layer:hover { filter: brightness(1.025); } .back:hover { background: var(--surface); } .try-avatar button:hover { filter: brightness(.97); } }
    @media (max-width: 440px) {
      body { background: var(--page); }
      .phone { margin: 0 auto; border-radius: 0; min-height: 100svh; box-shadow: none; }
      .header { padding-top: max(13px, env(safe-area-inset-top)); min-height: 70px; }
    }
    @media (max-width: 350px) {
      .intro { padding-inline: 22px; } .intro h2 { font-size: 21px; }
      .stack { margin-inline: 12px; } .layer { padding-inline: 20px; }
      .english { font-size: 22px; } .layer-title { gap: 8px; }
    }
    @media (prefers-color-scheme: dark) {
      :root { --canvas: #101113; --page: #1c1c1e; --ink: #f5f5f7; --muted: #aaaab1; --line: #38383c; --surface: #303034; --facts: #2b3d4c; --core: #344f65; --list: #304b56; --mirror: #423e30; --gaze: #334c62; --card-ink: #edf3f7; --card-muted: #c0cdd6; --focus: #90c9f2; }
    }
    @media (prefers-reduced-motion: reduce) { button { transition: none !important; } }
  </style>

    </section>
  </main>

      if(!visible)return null;
      const average=bubble.hex(total.map(c=>c/visible));
      if(chromatic/visible<.025)return {neutral:average,colors:[]};
      const candidates=bins.map((_,index)=>{
        const members=bins.map((b,j)=>({b,j})).filter(({b,j})=>b.weight&&hueDistance(j*10,index*10)<=10);
        const weight=members.reduce((v,{b})=>v+b.weight,0);
        let rgb=['r','g','b'].map(k=>weight?members.reduce((v,{b})=>v+b[k],0)/weight:0);
        const saturations=members.flatMap(({b})=>b.saturations).sort((a,b)=>a-b);
        const chroma=saturations[Math.floor((saturations.length-1)*.9)]||hslOf(bubble.hex(rgb))[1];
        const accents=members.flatMap(({b})=>b.samples).filter(p=>p.s>=chroma*.85&&p.l>.32&&p.l<.86);
        const accentWeight=accents.reduce((v,p)=>v+p.weight,0);
        if(accentWeight)rgb=[0,1,2].map(k=>accents.reduce((v,p)=>v+p.rgb[k]*p.weight,0)/accentWeight);
        const color=bubble.hex(rgb),[h,s,l]=hslOf(color);
        const score=Math.pow(weight,.25)*Math.pow(chroma,3);
        return {color,h,s,l,weight,chroma,score};
      }).filter(c=>c.weight>0);
      const largestWeight=Math.max(...candidates.map(c=>c.weight));
      const warm=c=>c.h>8&&c.h<50&&c.l>.42;
      // In portraits, a large central warm skin-like area is a supporting color.
      // Keep it when no substantial alternative family exists (e.g. a peach-only avatar).
      if(centralWarm/visible>.07&&candidates.some(c=>!warm(c)&&c.weight>largestWeight*.18)) {
        for(const c of candidates)if(warm(c))c.score*=.2;
      }
      candidates.sort((a,b)=>b.score-a.score);
      const colors=[];
      for(const c of candidates) {
        if(c.weight<largestWeight*.03)continue;
        if(colors.every(old=>hueDistance(c.h,old.h)>32))colors.push(c);
        if(colors.length===3)break;
      }
      return {neutral:average,colors};
    }
    const paletteCache=new Map();
    function extractMemoryColors(src) {
      if(paletteCache.has(src))return paletteCache.get(src);
      const result=new Promise(resolve=>{
        const img=new Image();img.crossOrigin='anonymous';let settled=false;
        const finish=value=>{if(settled)return;settled=true;clearTimeout(timer);img.onload=img.onerror=null;resolve(value);};
        const timer=setTimeout(()=>finish(null),8000);img.onerror=()=>finish(null);
        img.onload=()=>{
          try {
            const canvas=document.createElement('canvas');canvas.width=canvas.height=64;
            const ctx=canvas.getContext('2d',{willReadFrequently:true});if(!ctx)return finish(null);
            const side=Math.min(img.naturalWidth,img.naturalHeight);
            ctx.beginPath();ctx.arc(32,32,32,0,Math.PI*2);ctx.clip();
            ctx.drawImage(img,(img.naturalWidth-side)/2,(img.naturalHeight-side)/2,side,side,0,0,64,64);
            finish(representativeColors(ctx.getImageData(0,0,64,64).data));
          }catch{finish(null);}
        };img.src=src;
      });
      if(paletteCache.size>=64)paletteCache.delete(paletteCache.keys().next().value);
      paletteCache.set(src,result);return result;
    }
    function memoryPalette(sample,dark) {
      if(!sample.colors.length) {
        const [, ,l]=hslOf(sample.neutral);
        const light=dark?[.22,.28,.25,.19,.31]:[.965,.865,.925,.99,.825].map(v=>v+Math.min(.025,l*.025));
        return light.map(v=>hslColor(0,0,v));
      }
      const primary=sample.colors[0],secondary=sample.colors[1]||primary;
      // Five pastel roles from the sampled families, including the photograph's warm/cool supporting color.
      const make=(c,scale,l)=>hslColor(c.h,Math.min(.58,Math.max(.12,(c.s*.35+c.chroma*.65)*scale)),l);
      if(dark)return [make(primary,.55,.23),make(primary,.65,.29),make(secondary,.5,.26),make(secondary,.3,.2),make(primary,.58,.32)];
      return [make(primary,.42,.94),make(primary,.68,.82),make(secondary,.45,.91),make(secondary,.28,.975),make(primary,.58,.865)];
    }
    function applyPalette() {
      if (!avatarSample) {
        for (const key of keys) document.documentElement.style.removeProperty(`--${key}`);
        document.querySelectorAll('.layer').forEach(n=>{n.style.removeProperty('--card-muted');n.style.removeProperty('--card-ink');});
        return;
      }
      memoryPalette(avatarSample,systemTheme.matches).forEach((color,i)=>{
        document.documentElement.style.setProperty(`--${keys[i]}`,color);
        const luminance=c=>bubble.rgb(c).map(n=>n/255).map(n=>n<=.04045?n/12.92:((n+.055)/1.055)**2.4).reduce((v,n,i)=>v+n*[.2126,.7152,.0722][i],0);
        const surfaceLum=luminance(color);
        let label=bubble.ink(color);
        for(let weight=.26;weight>=.1;weight-=.04) {
          const candidate=bubble.mix(systemTheme.matches?'#ffffff':'#101012',color,weight),textLum=luminance(candidate);
          if((Math.max(surfaceLum,textLum)+.05)/(Math.min(surfaceLum,textLum)+.05)>=4.5) {label=candidate;break;}
        }
        const layer=document.querySelector(`[data-section="${keys[i]}"]`);
        layer.style.setProperty('--card-muted',label);
        const main=systemTheme.matches?'#edf3f7':'#263d4e',mainLum=luminance(main);
        layer.style.setProperty('--card-ink',(Math.max(surfaceLum,mainLum)+.05)/(Math.min(surfaceLum,mainLum)+.05)>=4.5?main:bubble.ink(color));
      });
    }
    // Integration input is Character.avatar (archive), never the session's chat avatar.
    async function applyCharacterAvatar(character) {
      const revision=++avatarRevision;
      avatarSample=null; applyPalette();
      if (!character?.avatar) {
        $('avatar-preview').hidden=true;
        $('avatar-status').textContent='没有档案头像，使用默认配色';
        return;
      }
      $('avatar-status').textContent='正在从头像生成五层配色…';
      const color=await extractMemoryColors(character.avatar);
      if (revision!==avatarRevision) return;
      const valid=!!color;
      avatarSample=valid?color:null; applyPalette();
      $('avatar-preview').hidden=!valid;
      if(valid) $('avatar-preview').src=character.avatar;
      $('avatar-status').textContent=valid?'已按这张头像取色 · 图片只在本地预览':'头像无法取色，使用默认配色';
    }
    systemTheme.addEventListener('change',applyPalette);
    $('choose-avatar').addEventListener('click',()=>$('avatar-file').click());
    $('avatar-file').addEventListener('change',()=>{
      const file=$('avatar-file').files[0]; if(!file) return;
      if(objectUrl) URL.revokeObjectURL(objectUrl);
      objectUrl=URL.createObjectURL(file);
      void applyCharacterAvatar({avatar:objectUrl});
      $('avatar-file').value='';
    });
    window.addEventListener('pagehide',()=>{if(objectUrl) URL.revokeObjectURL(objectUrl);});
    window.memoryPreview={applyCharacterAvatar,memoryPalette,extractMemoryColors,representativeColors};
  </script>
</body>
</html>
